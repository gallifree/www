<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vortex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.55" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#9f1239"/>
    </radialGradient>
  </defs>
  <style>
    .tardis { transform-box: fill-box; transform-origin: center; animation: tardis-spin 4s linear infinite; }
    @keyframes tardis-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .tardis { animation: none; } }
  </style>
  <!-- A nod to Gallifrey: a burnt-orange world under twin suns, with a tiny blue police box tumbling through, circled by a time-vortex "G".
       Original artwork. -->
  <path d="M50.38 13.62A26 26 0 1 0 58 32H46" stroke="url(#vortex)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="11" fill="url(#planet)"/>
  <g transform="translate(15.2 31) rotate(-14) scale(0.333)">
   <g class="tardis">
    <rect x="-0.55" y="-5.3" width="1.1" height="1" rx="0.3" fill="#fde68a"/>
    <rect x="-2.5" y="-4.4" width="5" height="0.8" rx="0.2" fill="#1e3a8a"/>
    <rect x="-2.2" y="-3.7" width="4.4" height="8.2" fill="#2563eb" stroke="#1e3a8a" stroke-width="0.4"/>
    <rect x="-1.8" y="-3.4" width="3.6" height="0.8" fill="#0f172a"/>
    <rect x="-1.5" y="-2.1" width="1.2" height="1.2" fill="#dbeafe"/>
    <rect x="0.3" y="-2.1" width="1.2" height="1.2" fill="#dbeafe"/>
    <path d="M0 -2.6V4.5M-1.5 1H-0.3M0.3 1H1.5M-1.5 2.9H-0.3M0.3 2.9H1.5" stroke="#1e3a8a" stroke-width="0.35"/>
   </g>
  </g>
  <circle cx="57" cy="24.8" r="3.6" fill="#fbbf24"/>
  <circle cx="54.3" cy="18.6" r="2.4" fill="#fde68a"/>
</svg>
