  <circle cx="13.6" cy="50.4" r="5" stroke="url(#vortex)" stroke-width="1.6" fill="none"/>
  <circle cx="13.6" cy="50.4" r="1.4" fill="#06b6d4"/>
  <circle cx="32" cy="32" r="11" fill="url(#planet)"/>
  <path d="M26.5 23.2A5.5 5.5 0 0 1 37.5 23.2Z" fill="#a5f3fc" fill-opacity="0.45" stroke="#cffafe" stroke-width="1.1" stroke-linejoin="round"/>
  <circle cx="57" cy="24.8" r="3.6" fill="#fbbf24"/>
